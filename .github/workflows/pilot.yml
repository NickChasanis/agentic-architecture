name: Pilot verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pilot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: pilot/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y tmux acl
      - run: npx playwright install --with-deps chromium
      - name: Create disposable local fixture
        run: |
          node infra/setup.mjs
          # Keycloak's UID 1000 reads bind-mounted files; runner UID can differ.
          sudo setfacl -m u:1000:r .local/tls.key .local/tls.crt .local/realm.json
          docker compose -p agentic-ci --env-file .local/compose.env -f infra/compose.yaml up -d
      - name: Wait for trusted provider
        run: |
          for attempt in $(seq 1 120); do
            if curl --silent --fail --cacert .local/tls.crt https://localhost:8443/realms/agentic-pilot/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Seed and verify all contracts and journeys
        run: |
          node --import tsx infra/database.ts
          export PILOT_CHROME="$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")"
          npm run verify:connected
      - name: Stop disposable stack
        if: always()
        run: docker compose -p agentic-ci --env-file .local/compose.env -f infra/compose.yaml down
