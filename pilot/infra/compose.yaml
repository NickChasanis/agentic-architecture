name: agentic-foundation
services:
  db:
    image: postgres@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pilot
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - database:/var/lib/postgresql/data
      - ../.local/init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pilot"]
      interval: 2s
      timeout: 2s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:9b0330756022422149aa6502eb2def8cd47c6e1b000c7c65cdb13e7c0133e992
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://localhost:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/local.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/local.key
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ../.local/tls.crt:/opt/keycloak/conf/local.crt:ro
      - ../.local/tls.key:/opt/keycloak/conf/local.key:ro
      - ../.local/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 1024m
volumes:
  database:
